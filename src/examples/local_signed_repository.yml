description: >
  Build your own APKs with melange, sign them with an ephemeral key, and install
  them from a build-local repository alongside public Wolfi packages. The apko
  configuration lists the local repository and public key as paths relative to
  the job's working directory, for example:

    contents:
      keyring:
        - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
        - ./melange.rsa.pub
      repositories:
        - https://packages.wolfi.dev/os
        - '@local ./packages'
      packages:
        - my-app@local

  Pin local packages with "@local". Otherwise apko installs the highest version
  found in any repository, so a same-named public package could replace yours.
  A machine executor is used because melange's docker runner needs a local
  Docker daemon.

usage:
  version: 2.1
  orbs:
    apko: juburr/apko-orb@1.2.1
    melange: juburr/melange-orb@1.3.0
  jobs:
    build-images:
      machine:
        image: ubuntu-2404:current
      steps:
        - checkout
        - apko/install
        - melange/install
        # Writes melange.rsa and melange.rsa.pub.
        - melange/keygen
        # Signs with melange.rsa and writes packages/x86_64.
        - melange/build:
            config: melange.yaml
            arch: x86_64
        - apko/build:
            config: apko.yaml
            image: ghcr.io/example/my-app:latest
            output_path: my-app.tar
  workflows:
    use-my-orb:
      jobs:
        - build-images
