description: Installs the apko binary. This command should be invoked prior to calling any other commands.
parameters:
  caching:
    type: boolean
    default: true
  install_path:
    type: string
    default: "/home/circleci/bin"
    description: Path to a binary directory not requiring root access (no trailing slash).
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      Option to perform SHA-512 checksum verification on the downloaded Apko executable.
      "strict" (default) fails the install when the requested version has no checksum in this orb's lookup table.
      "known_versions" verifies listed versions but installs unlisted versions unverified, with a warning.
      "false" disables verification entirely and is not recommended.
  version:
    type: string
    default: "1.4.6"
    description: Specify the semver of the Apko version to install.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        - restore_cache:
            key: apko-cache-<< parameters.version >>-{{ arch }}
  - run:
      name: Install Apko << parameters.version >>
      environment:
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: apko-cache-<< parameters.version >>-{{ arch }}
            paths:
              - apko.tar.gz
  - run:
      name: Cleanup Apko Install
      command: rm apko.tar.gz
