# Tests the GitHub Actions in actions/ on GitHub's own runners, as
# .circleci/test-deploy.yml tests the orb's commands on CircleCI. Each job
# runs the actions from this checkout (uses: ./actions/...), so a pull
# request tests its own changes.
name: GitHub Actions

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline tests
        run: |
          for test in src/tests/actions_test.sh src/tests/commands_test.sh src/tests/install_test.sh src/tests/env-subst.sh src/tests/shell_conventions_test.sh; do
            echo "=== ${test}"
            bash "${test}"
          done

  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - name: Verify the install
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          [[ "$(command -v apko)" == "${HOME}/bin/apko" ]]
          apko version | tee "${RUNNER_TEMP}/version.log"
          grep -F "${version}" "${RUNNER_TEMP}/version.log"
          grep -E "Platform:[[:space:]]+${PLATFORM}" "${RUNNER_TEMP}/version.log"
      # The first install saved the release to the cache, so this one
      # restores it. It goes to a directory of its own, which later steps
      # find first on the PATH.
      - uses: ./actions/install
        with:
          install_path: ${{ runner.temp }}/second
      - name: Verify the second install comes first on the PATH
        env:
          SECOND: ${{ runner.temp }}/second
        run: |
          [[ "$(command -v apko)" == "${SECOND}/apko" ]]
          apko version
      - name: Install an unlisted version, which must fail
        id: unlisted
        continue-on-error: true
        uses: ./actions/install
        with:
          version: 0.0.1
          caching: false
          install_path: ${{ runner.temp }}/unlisted
      - name: Verify it failed before installing anything
        env:
          OUTCOME: ${{ steps.unlisted.outcome }}
          UNLISTED: ${{ runner.temp }}/unlisted
        run: |
          [[ "${OUTCOME}" == failure ]]
          [[ ! -e "${UNLISTED}/apko" ]]

  # A fresh runner with the release's download hosts blocked installs from
  # the cache the install job saved, which only works if the cache is used.
  install-from-cache:
    needs: install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block the download hosts
        run: |
          echo "127.0.0.1 github.com objects.githubusercontent.com release-assets.githubusercontent.com" | sudo tee -a /etc/hosts
          if curl -sSf --max-time 10 -o /dev/null https://github.com; then
            echo "github.com is still reachable."
            exit 1
          fi
      - uses: ./actions/install
      - name: Verify the install
        run: |
          version=$(grep -A3 '^  version:' src/commands/install.yml | sed -n 's/^    default: "\(.*\)"$/\1/p')
          apko version | grep -F "${version}"

  # Builds the amd64 test image on both architectures: apko assembles images
  # without running code for the target architecture. The amd64 runner also
  # loads and runs it.
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/build
        with:
          config: src/tests/gdal-runtime.yaml
          image: ghcr.io/juburr/apko-orb/gdal-runtime-test:latest
          output_path: new-directory/gdal-runtime.tar
      - name: Load the built image
        run: |
          docker load --input new-directory/gdal-runtime.tar
          # apko suffixes loaded tags with the image architecture.
          IMAGE=ghcr.io/juburr/apko-orb/gdal-runtime-test:latest-amd64
          IMAGE_USER=$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")
          echo "Image user: ${IMAGE_USER}"
          if [[ "${IMAGE_USER}" != "65532" ]]; then
            echo "Expected the image to run as UID 65532"
            exit 1
          fi
      - name: Run the built image
        if: runner.arch == 'X64'
        run: docker run --rm ghcr.io/juburr/apko-orb/gdal-runtime-test:latest-amd64 gdalinfo --version

  # apko assembles each architecture without emulation, so an amd64 runner
  # can produce the arm64 image too.
  multi-arch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/build
        with:
          arch: amd64,arm64
          config: src/tests/multi-arch.yaml
          image: multi-arch-test:latest
          log_level: info
          output_path: multi-arch/image.tar
      - name: Verify the image index platforms
        run: |
          PLATFORMS=$(tar -xOf multi-arch/image.tar index.json | jq -r '[.manifests[].platform.architecture] | sort | join(",")')
          echo "Index platforms: ${PLATFORMS}"
          if [[ "${PLATFORMS}" != "amd64,arm64" ]]; then
            echo "Expected an image index with amd64 and arm64 manifests"
            exit 1
          fi
      - name: Load and run the built images
        run: |
          docker load --input multi-arch/image.tar
          for ARCH in amd64 arm64; do
            ACTUAL=$(docker image inspect --format '{{.Architecture}}' "multi-arch-test:latest-${ARCH}")
            echo "multi-arch-test:latest-${ARCH} architecture: ${ACTUAL}"
            if [[ "${ACTUAL}" != "${ARCH}" ]]; then
              echo "Unexpected architecture for the ${ARCH} image"
              exit 1
            fi
          done
          docker run --rm multi-arch-test:latest-amd64 busybox echo "amd64 image runs"

  # Locks the busybox test image's packages, builds it from the lock file into
  # a cache directory, then builds it again offline from that cache, with
  # annotations, a build date, no VCS annotations and an SBOM directory.
  build-options:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: ./actions/lock
        with:
          config: src/tests/multi-arch.yaml
          output: locks/multi-arch.lock.json
          arch: amd64
          cache_dir: apk-cache
      - uses: ./actions/build
        with:
          config: src/tests/multi-arch.yaml
          image: build-options-test:cached
          output_path: cached/image.tar
          arch: amd64
          lockfile: locks/multi-arch.lock.json
          cache_dir: apk-cache
          log_level: info
      - name: Verify the build from the lock file
        run: bash src/tests/verify_build_options.sh cached cached/image.tar locks/multi-arch.lock.json
      - uses: ./actions/build
        with:
          config: src/tests/multi-arch.yaml
          image: build-options-test:offline
          output_path: offline/image.tar
          arch: amd64
          lockfile: locks/multi-arch.lock.json
          cache_dir: apk-cache
          offline: true
          vcs: false
          build_date: "2099-01-02T03:04:05Z"
          sbom_path: offline/sboms
          annotations: |
            org.example.description:Built by apko-orb, for its "offline" test
            org.example.team:platform
          log_level: info
      - name: Verify the offline build
        run: bash src/tests/verify_build_options.sh offline offline/image.tar locks/multi-arch.lock.json offline/sboms

  # Logs in to a local registry that requires a login, publishes a two
  # architecture image under two tags, and checks what the registry holds
  # against what publish exported.
  publish:
    runs-on: ubuntu-24.04
    env:
      REGISTRY_HOST: localhost:5000
      REGISTRY_USERNAME: ci-user
      REGISTRY_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start a registry that requires a login
        run: |
          for image in mirror.gcr.io/library/httpd:2 mirror.gcr.io/library/registry:2; do
            for attempt in 1 2 3; do
              docker pull "${image}" && break
              sleep $((attempt * 10))
            done
          done
          mkdir -p "${RUNNER_TEMP}/registry-auth"
          docker run --rm --entrypoint htpasswd mirror.gcr.io/library/httpd:2 -Bbn "${REGISTRY_USERNAME}" "${REGISTRY_PASSWORD}" \
            > "${RUNNER_TEMP}/registry-auth/htpasswd"
          docker run -d --name registry -p 5000:5000 -v "${RUNNER_TEMP}/registry-auth:/auth" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=apko-orb-ci \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd mirror.gcr.io/library/registry:2
          # A 401 means the registry is up and refuses anonymous requests.
          for _ in $(seq 1 30); do
            if [[ "$(curl -s -o /dev/null -w '%{http_code}' "http://${REGISTRY_HOST}/v2/")" == "401" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo "The registry did not start."
          docker logs registry
          exit 1
      - uses: ./actions/install
      - uses: ./actions/login
        with:
          registry: localhost:5000
      - uses: ./actions/publish
        with:
          config: src/tests/multi-arch.yaml
          tags: localhost:5000/apko-orb-ci/publish-test:latest localhost:5000/apko-orb-ci/publish-test:v1
          arch: amd64,arm64
          image_refs: publish/refs.txt
          sbom_path: publish/sboms
      - name: Verify the published image
        run: bash src/tests/verify_publish.sh "${REGISTRY_HOST}/apko-orb-ci/publish-test" publish/refs.txt publish/sboms latest v1

  # Builds a product APK with melange, signs it and its index with an
  # ephemeral key, then installs it from the build-local repository with
  # apko. melange comes from the companion melange-orb's actions.
  local-repository:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/install
      - uses: juburr/melange-orb/actions/install@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
      # keygen writes melange.rsa and melange.rsa.pub, and build signs with
      # melange.rsa into packages/x86_64, where apko.yaml looks for them.
      - uses: juburr/melange-orb/actions/keygen@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
      - uses: juburr/melange-orb/actions/build@852099260f7e1813459ba515f0104d1889709d32 # v1.3.0
        with:
          config: src/tests/local-repository/melange.yaml
          arch: x86_64
      - name: Reject the repository without its key
        run: |
          grep -v 'melange.rsa.pub' src/tests/local-repository/apko.yaml > "${RUNNER_TEMP}/apko-without-key.yaml"
          if apko build "${RUNNER_TEMP}/apko-without-key.yaml" local-repository-test:untrusted "${RUNNER_TEMP}/untrusted.tar" > "${RUNNER_TEMP}/untrusted.log" 2>&1; then
            echo "apko installed from a repository whose signing key is not in the keyring"
            exit 1
          fi
          grep 'no signature with known key' "${RUNNER_TEMP}/untrusted.log"
      - uses: ./actions/build
        with:
          config: src/tests/local-repository/apko.yaml
          image: local-repository-test:latest
          log_level: info
          output_path: local-repository/image.tar
      - name: Run the built image
        run: |
          docker load --input local-repository/image.tar
          OUTPUT=$(docker run --rm local-repository-test:latest-amd64)
          echo "${OUTPUT}"
          if [[ "${OUTPUT}" != "hello from a local signed apk" ]]; then
            echo "Unexpected output from the locally built package"
            exit 1
          fi
