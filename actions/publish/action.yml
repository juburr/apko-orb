name: Build and publish an apko image
description: >
  Builds an image with apko publish and pushes it to a registry under every
  reference in tags, then exports the image index's digest and its reference by
  digest for later steps, such as signing. Each architecture's image goes to
  the repository of the first tag, by digest. apko reads the credentials the
  login action or docker login stored, and for ghcr.io also GITHUB_TOKEN, when
  the step's env sets it. Building needs no Docker daemon. Run the install
  action first. The GitHub Actions twin of the orb's publish command.
author: juburr

inputs:
  config:
    description: >
      Path to the apko image configuration YAML file, for example apko.yaml.
    required: true
  tags:
    description: >
      Image references to push the image to, separated by commas, spaces or
      newlines, such as "ghcr.io/myorg/myapp:1.0.0 ghcr.io/myorg/myapp:latest".
      apko pushes each architecture's image to the first one's repository, by
      digest, and the image index under every reference.
    required: true
  arch:
    description: >
      Architectures to build, passed to apko's --arch flag, separated by
      commas, spaces or newlines (e.g. "amd64,arm64", or "host"). Overrides the
      "archs" list in the configuration file. Leave empty to use the
      configuration file, or every architecture apko supports when it lists
      none.
    default: ""
  lockfile:
    description: >
      Path to a lock file the lock action wrote, passed as --lockfile: apko
      installs exactly the package versions it lists. Leave empty to install
      the newest versions the repositories offer.
    default: ""
  build_date:
    description: >
      Date and time in RFC 3339, such as 2025-01-31T12:00:00Z, passed as
      --build-date. The image's creation time is this date or the newest
      installed package's build time, whichever is later. Leave empty for the
      newest package's build time, so that the same packages give the same
      image.
    default: ""
  vcs:
    description: >
      Detect the Git repository that holds the configuration file, and record
      its URL and commit in the image index's org.opencontainers.image.source
      and org.opencontainers.image.revision annotations. false passes
      --vcs=false.
    default: "true"
  sbom:
    description: >
      Write SPDX SBOMs of the image: sbom-<arch>.spdx.json for each
      architecture and sbom-index.spdx.json for the index. false passes
      --sbom=false.
    default: "true"
  sbom_path:
    description: >
      Directory to keep the SBOMs in, created when missing, passed as
      --sbom-path. Leave empty to discard them: apko publish keeps SBOMs only
      where this says.
    default: ""
  keyring_append:
    description: >
      Public keys to trust besides the configuration's keyring, as paths or
      URLs, separated by commas, spaces or newlines, such as melange.rsa.pub.
      Each is passed as --keyring-append.
    default: ""
  repository_append:
    description: >
      APK repositories to install from besides the configuration's, as paths or
      URLs, separated by commas, spaces or newlines, such as packages. Each is
      passed as --repository-append. A tagged repository, such as "@local
      ./packages", goes in the configuration file.
    default: ""
  package_append:
    description: >
      Packages to install besides the configuration's, separated by commas,
      spaces or newlines, such as busybox or curl=8.11.0-r0. Each is passed as
      --package-append.
    default: ""
  annotations:
    description: >
      OCI annotations for the image and its index, one key:value per line, such
      as org.opencontainers.image.source:https://github.com/myorg/myapp. Values
      can hold spaces and commas. Each is passed as --annotations.
    default: ""
  cache_dir:
    description: >
      Directory for apko's cache of APK indexes, keys and packages, passed as
      --cache-dir. Leave empty for apko's default cache directory. Keep it
      between jobs with save_cache and restore_cache, or fill it once for
      offline builds.
    default: ""
  offline:
    description: >
      Build without the network (--offline): every index, key and package must
      already be in the cache, as an earlier the build or publish action with
      the same cache_dir leaves them.
    default: "false"
  image_refs:
    description: >
      File to write the pushed references to, one per line: each architecture's
      image by digest, then the index by digest. Missing parent directories are
      created. Leave empty to only print them.
    default: ""
  digest_env_var:
    description: >
      Environment variable to export the image index's digest in, such as
      sha256:2f9a..., for later steps.
    default: APKO_DIGEST
  digest_ref_env_var:
    description: >
      Environment variable to export the image index's reference by digest in,
      such as ghcr.io/myorg/myapp@sha256:2f9a..., for later steps.
    default: APKO_DIGEST_REF
  log_level:
    description: >
      Logging level to use: debug, info, warn, error, fatal or panic.
    default: info
  extra_args:
    description: >
      Further arguments for apko publish, such as
      --build-repository-append=packages. They are split like shell words, but
      nothing in them is expanded or run. --image-refs and --local are refused.
    default: ""

runs:
  using: composite
  steps:
    - name: Build and publish apko image
      shell: bash
      env:
        PARAM_ANNOTATIONS: ${{ inputs.annotations }}
        PARAM_ARCH: ${{ inputs.arch }}
        PARAM_BUILD_DATE: ${{ inputs.build_date }}
        PARAM_CACHE_DIR: ${{ inputs.cache_dir }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_DIGEST_ENV_VAR: ${{ inputs.digest_env_var }}
        PARAM_DIGEST_REF_ENV_VAR: ${{ inputs.digest_ref_env_var }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_IMAGE_REFS: ${{ inputs.image_refs }}
        PARAM_KEYRING_APPEND: ${{ inputs.keyring_append }}
        PARAM_LOCKFILE: ${{ inputs.lockfile }}
        PARAM_LOG_LEVEL: ${{ inputs.log_level }}
        PARAM_OFFLINE: ${{ inputs.offline }}
        PARAM_PACKAGE_APPEND: ${{ inputs.package_append }}
        PARAM_REPOSITORY_APPEND: ${{ inputs.repository_append }}
        PARAM_SBOM: ${{ inputs.sbom }}
        PARAM_SBOM_PATH: ${{ inputs.sbom_path }}
        PARAM_TAGS: ${{ inputs.tags }}
        PARAM_VCS: ${{ inputs.vcs }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/publish.sh"
        "SCRIPT_APKO_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/apko.sh"
