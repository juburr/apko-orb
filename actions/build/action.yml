name: Build an apko image
description: >
  Builds an image with apko build and writes it to output_path. The image is
  not pushed to a registry, and building needs no Docker daemon. Run the
  install action first. The GitHub Actions twin of the orb's build command.
author: juburr

inputs:
  arch:
    description: >
      Architectures to build, passed to apko's --arch flag as a
      comma-separated list (e.g. "amd64,arm64", or "host"). Overrides the
      "archs" list in the configuration file. Leave empty to use the
      configuration file.
    default: ""
  config:
    description: Path to the apko image configuration YAML file, for example apko.yaml.
    required: true
  image:
    description: >
      Image reference recorded in the output, passed to apko as its <tag>
      argument, for example ghcr.io/org/app:1.0. The image is not pushed.
      Loading the tarball with docker load tags each architecture's image
      with this reference plus an architecture suffix, for example
      ghcr.io/org/app:1.0-amd64.
    required: true
  log_level:
    description: >
      Logging level to use: debug, info, warn, error, fatal or panic.
    default: debug
  output_path:
    description: >
      Where apko writes the image. Normally the path of an OCI image tarball
      file to create, for example build/app.tar; missing parent directories
      are created. If the path is an existing directory, apko writes an OCI
      image layout into that directory instead of a tarball.
    required: true

runs:
  using: composite
  steps:
    - name: Build apko image
      shell: bash
      env:
        PARAM_ARCH: ${{ inputs.arch }}
        PARAM_CONFIG: ${{ inputs.config }}
        PARAM_IMAGE: ${{ inputs.image }}
        PARAM_LOG_LEVEL: ${{ inputs.log_level }}
        PARAM_OUTPUT_PATH: ${{ inputs.output_path }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/build.sh"
