version: 2.1
setup: true
orbs:
  orb-tools: circleci/orb-tools@12.5
  shellcheck: circleci/shellcheck@3.4

filters: &filters
  tags:
    only: /.*/

jobs:
  test-install:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run install contract tests
          command: bash src/tests/install_test.sh
  test-actions:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Check the GitHub Actions against the orb's commands
          command: bash src/tests/actions_test.sh
  test-commands:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Run the build, publish, lock and login tests against a stand-in apko
          command: bash src/tests/commands_test.sh

workflows:
  lint-pack:
    jobs:
      - test-install:
          filters: *filters
      - test-actions:
          filters: *filters
      - test-commands:
          filters: *filters
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          orb_name: apko
          filters: *filters
      - shellcheck/check:
          filters: *filters
      # Triggers the next workflow in the Orb Development Kit.
      - orb-tools/continue:
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          orb_name: apko-orb
          requires: [test-install, test-actions, test-commands, orb-tools/lint, orb-tools/pack, orb-tools/review, shellcheck/check]
          filters: *filters
