version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.5
  melange: juburr/melange-orb@1.0.0
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  apko-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - apko-orb/install
      - run:
          name: Verify Install
          command: command -v apko
      - run:
          name: Log Apko Version
          command: apko version
      - apko-orb/build:
          config: src/tests/gdal-runtime.yaml
          image: ghcr.io/juburr/apko-orb/gdal-runtime-test:latest
          log_level: debug
          output_path: new-directory/gdal-runtime.tar
      - setup_remote_docker
      - run:
          name: Run Built Image
          command: |
            docker load --input new-directory/gdal-runtime.tar
            # apko suffixes loaded tags with the image architecture.
            IMAGE=ghcr.io/juburr/apko-orb/gdal-runtime-test:latest-amd64
            IMAGE_USER=$(docker image inspect --format '{{.Config.User}}' "${IMAGE}")
            echo "Image user: ${IMAGE_USER}"
            if [[ "${IMAGE_USER}" != "65532" ]]; then
              echo "Expected the image to run as UID 65532"
              exit 1
            fi
            docker run --rm "${IMAGE}" gdalinfo --version
  multi-arch-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - apko-orb/install
      # apko assembles each architecture without emulation, so an amd64
      # executor can produce the arm64 image too.
      - apko-orb/build:
          arch: amd64,arm64
          config: src/tests/multi-arch.yaml
          image: multi-arch-test:latest
          log_level: info
          output_path: multi-arch/image.tar
      - run:
          name: Verify Image Index Platforms
          command: |
            PLATFORMS=$(tar -xOf multi-arch/image.tar index.json | jq -r '[.manifests[].platform.architecture] | sort | join(",")')
            echo "Index platforms: ${PLATFORMS}"
            if [[ "${PLATFORMS}" != "amd64,arm64" ]]; then
              echo "Expected an image index with amd64 and arm64 manifests"
              exit 1
            fi
      - setup_remote_docker
      - run:
          name: Load And Run Built Images
          command: |
            docker load --input multi-arch/image.tar
            for ARCH in amd64 arm64; do
              ACTUAL=$(docker image inspect --format '{{.Architecture}}' "multi-arch-test:latest-${ARCH}")
              echo "multi-arch-test:latest-${ARCH} architecture: ${ACTUAL}"
              if [[ "${ACTUAL}" != "${ARCH}" ]]; then
                echo "Unexpected architecture for the ${ARCH} image"
                exit 1
              fi
            done
            docker run --rm multi-arch-test:latest-amd64 busybox echo "amd64 image runs"
  # Builds a product APK with melange, signs it and its index with an ephemeral
  # key, then installs it from the build-local repository with apko.
  # A machine executor is used because melange's docker runner needs a local
  # Docker daemon that can bind-mount the workspace.
  local-repository-test:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - apko-orb/install
      - melange/install:
          version: 0.61.2
          verify_checksums: strict
      - run:
          name: Build Signed APK With Ephemeral Key
          command: |
            melange keygen
            melange build src/tests/local-repository/melange.yaml \
              --arch x86_64 \
              --runner docker \
              --signing-key melange.rsa \
              --out-dir packages
      - run:
          name: Reject Repository Without Its Key
          command: |
            grep -v 'melange.rsa.pub' src/tests/local-repository/apko.yaml > /tmp/apko-without-key.yaml
            if apko build /tmp/apko-without-key.yaml local-repository-test:untrusted /tmp/untrusted.tar > /tmp/untrusted.log 2>&1; then
              echo "apko installed from a repository whose signing key is not in the keyring"
              exit 1
            fi
            grep 'no signature with known key' /tmp/untrusted.log
      - apko-orb/build:
          config: src/tests/local-repository/apko.yaml
          image: local-repository-test:latest
          log_level: info
          output_path: local-repository/image.tar
      - run:
          name: Run Built Image
          command: |
            docker load --input local-repository/image.tar
            OUTPUT=$(docker run --rm local-repository-test:latest-amd64)
            echo "${OUTPUT}"
            if [[ "${OUTPUT}" != "hello from a local signed apk" ]]; then
              echo "Unexpected output from the locally built package"
              exit 1
            fi
  command-test-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
    steps:
      - checkout
      # No install path preparation: install creates install_path and adds it
      # to the PATH of later steps on machine executors too.
      - apko-orb/install:
          verify_checksums: strict
      - run:
          name: Verify Native arm64 Binary
          command: |
            uname -m
            apko version
            apko version | grep -E 'Platform:[[:space:]]+linux/arm64'
      # apko assembles images without executing target-arch code, so the amd64
      # test image also builds on an arm64 executor.
      - apko-orb/build:
          config: src/tests/gdal-runtime.yaml
          image: ghcr.io/juburr/apko-orb/gdal-runtime-test:latest
          log_level: info
          output_path: new-directory/gdal-runtime.tar
  env-subst-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Parameter Values Reach circleci env subst On Stdin
          command: bash src/tests/env-subst.sh
  shell-conventions-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      - run:
          name: Scripts Follow The Shell Conventions
          command: bash src/tests/shell_conventions_test.sh
workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - multi-arch-test:
          filters: *filters
      - local-repository-test:
          filters: *filters
      - command-test-arm64:
          filters: *filters
      - env-subst-test:
          filters: *filters
      - shell-conventions-test:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/apko-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - command-test-arm64
            - env-subst-test
            - local-repository-test
            - shell-conventions-test
            - multi-arch-test
          context: orb-publishing
          filters: *release-filters
